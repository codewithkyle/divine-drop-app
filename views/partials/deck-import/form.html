<form
    class="import-panel"
    hx-post="/decks/import/preview"
    hx-target="deck-import"
    hx-swap="innerHTML"
    hx-encoding="multipart/form-data"
>
    <header>
        <h1>Import a deck</h1>
    </header>

    <div class="instructions">
        <span class="step">1</span>
        <p>Open your deck on <a href="https://www.moxfield.com" target="_blank" rel="noopener noreferrer">Moxfield</a> or <a href="https://archidekt.com" target="_blank" rel="noopener noreferrer">Archidekt</a>.</p>
        <span class="step">2</span>
        <p>Export your deck as plain text or as MTGO.</p>
        <span class="step">3</span>
        <p>Upload the text file or paste the list below.</p>
        <span class="step">4</span>
        <p>Begin the import process.</p>
    </div>

    <div class="field">
        <label for="import-gamemode">Format restrictions</label>
        <div class="select">
            <select id="import-gamemode" name="gamemode">
                <option {{ if eq .Gamemode "" }}selected{{ end }} value="">No Restrictions</option>
                <option {{ if eq .Gamemode "standard" }}selected{{ end }} value="standard">Standard</option>
                <option {{ if eq .Gamemode "future" }}selected{{ end }} value="future">Future</option>
                <option {{ if eq .Gamemode "historic" }}selected{{ end }} value="historic">Historic</option>
                <option {{ if eq .Gamemode "gladiator" }}selected{{ end }} value="gladiator">Gladiator</option>
                <option {{ if eq .Gamemode "pioneer" }}selected{{ end }} value="pioneer">Pioneer</option>
                <option {{ if eq .Gamemode "explorer" }}selected{{ end }} value="explorer">Explorer</option>
                <option {{ if eq .Gamemode "modern" }}selected{{ end }} value="modern">Modern</option>
                <option {{ if eq .Gamemode "legacy" }}selected{{ end }} value="legacy">Legacy</option>
                <option {{ if eq .Gamemode "pauper" }}selected{{ end }} value="pauper">Pauper</option>
                <option {{ if eq .Gamemode "vintage" }}selected{{ end }} value="vintage">Vintage</option>
                <option {{ if eq .Gamemode "penny" }}selected{{ end }} value="penny">Penny</option>
                <option {{ if eq .Gamemode "commander" }}selected{{ end }} value="commander">Commander</option>
                <option {{ if eq .Gamemode "oathbreaker" }}selected{{ end }} value="oathbreaker">Oathbreaker</option>
                <option {{ if eq .Gamemode "brawl" }}selected{{ end }} value="brawl">Brawl</option>
                <option {{ if eq .Gamemode "historicbrawl" }}selected{{ end }} value="historicbrawl">Historic Brawl</option>
                <option {{ if eq .Gamemode "alchemy" }}selected{{ end }} value="alchemy">Alchemy</option>
                <option {{ if eq .Gamemode "paupercommander" }}selected{{ end }} value="paupercommander">Pauper Commander</option>
                <option {{ if eq .Gamemode "duel" }}selected{{ end }} value="duel">Duel</option>
                <option {{ if eq .Gamemode "oldschool" }}selected{{ end }} value="oldschool">Oldschool</option>
                <option {{ if eq .Gamemode "premodern" }}selected{{ end }} value="premodern">Premodern</option>
                <option {{ if eq .Gamemode "predh" }}selected{{ end }} value="predh">preDH</option>
            </select>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
        </div>
    </div>

    <div class="field">
        <label for="import-file">Deck list file</label>
        <input id="import-file" type="file" name="file" accept=".txt,text/plain">
    </div>

    <div class="field">
        <label for="import-list">Or paste the list</label>
        <textarea id="import-list" name="list" rows="8" spellcheck="false" placeholder="1 Sol Ring&#10;1 Arcane Signet&#10;9 Forest"></textarea>
    </div>

    <div class="actions">
        <button type="submit" class="bttn -yellow import-submit">
            <span>Begin import</span>
        </button>
    </div>
</form>
