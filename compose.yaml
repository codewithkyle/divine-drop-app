services:
  divinedrop:
    build: .
    ports:
      - "3000:3000"
    env_file: ".env"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - divine-network
    restart: always
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: "divinedrop"
      MYSQL_USER: "ddadmin"
      MYSQL_PASSWORD: "password"
    volumes:
      - mysql_data:/var/lib/mysql
      # The mysql image runs anything in here the first time it initialises an
      # empty data directory, against MYSQL_DATABASE. The dump is a plain
      # mysqldump with no CREATE DATABASE or USE of its own, which is exactly
      # what that entrypoint expects.
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      # The app connects at startup and exits if the database is not up yet, so
      # hold it back until mysql is actually accepting connections rather than
      # letting it crash and restart its way to a working boot.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Generous, because the very first boot imports the dump before mysql
      # accepts TCP connections. Failures inside start_period do not count
      # against retries, and later boots pass on the first check.
      start_period: 300s
    networks:
      - divine-network
networks:
  divine-network:
    driver: bridge
volumes:
  mysql_data:
